<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carpentry">
<title>Carpentry</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#F3EDE2}
html{background:#1E3B2A}
#app{max-width:480px;margin:0 auto;min-height:100vh}
:root{--pine:#1E3B2A;--cream:#F3EDE2;--paper:#FDFAF5;--amber:#B87A1A;--amberlt:#F5E6C8;--ink:#1A1A1A;--slate:#5A6472;--border:#D8D0C4;--white:#FFFFFF;--err:#B33A2A;--errlt:#FDECEA;--green:#1A6B3C;--greenlt:#D4EDDA}
.topbar{background:var(--pine);color:var(--cream);padding:14px 16px 12px;padding-top:calc(env(safe-area-inset-top, 0px) + 14px);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;gap:12px}
.card{background:var(--paper);border-radius:14px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.cbody{padding:14px 16px}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none;font-family:inherit}
.inp:focus{border-color:var(--pine)}
.lbl{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:5px;display:block}
.btnp{background:var(--pine);color:var(--cream);border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;width:100%;cursor:pointer;font-family:inherit}
.bsm{border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.back{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center;color:var(--cream);font-size:22px;line-height:1;font-weight:300}
.bp{padding:14px 16px 80px}
.day-card{background:var(--paper);border-radius:12px;border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.dh{padding:9px 14px;display:flex;align-items:center;gap:8px;background:var(--paper)}
.dh.wknd{background:var(--amberlt)}
.dn{font-size:13px;font-weight:700;color:var(--pine);min-width:32px}
.dh.wknd .dn{color:var(--amber)}
.dd{font-size:12px;color:var(--slate);flex:1}
.dhr{font-size:13px;font-weight:700;color:var(--pine)}
.trow{padding:10px 14px;display:flex;gap:8px;align-items:center}
.tinp{flex:1;padding:9px 8px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:15px;color:var(--ink);outline:none;-webkit-appearance:none;text-align:center;font-family:inherit}
.tinp:focus{border-color:var(--pine)}
.tdash{color:var(--slate);font-size:18px;flex-shrink:0}
.ttot{min-width:44px;text-align:right;font-size:14px;font-weight:800;color:var(--pine);font-variant-numeric:tabular-nums;flex-shrink:0}
.rrow{display:flex;align-items:center;gap:6px;padding:0 14px 8px 18px}
.raccent{width:3px;background:var(--border);border-radius:2px;align-self:stretch;flex-shrink:0}
.rinp{padding:8px 9px;border-radius:9px;border:1.5px solid var(--border);background:var(--white);font-size:14px;color:var(--ink);outline:none;font-family:inherit;-webkit-appearance:none}
.rinp:focus{border-color:var(--pine)}
.rthumb{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1.5px solid var(--border);cursor:pointer;flex-shrink:0}
.sumcard{background:var(--paper);border-radius:14px;border:2px solid var(--pine);margin-bottom:12px;overflow:hidden}
.sumrow{display:flex;justify-content:space-between;padding:5px 16px;align-items:baseline}
.sumrow.tot{padding:12px 16px;border-top:1px solid var(--pine)}
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:var(--pine);color:var(--cream);padding:9px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.wkcard{background:var(--paper);border-radius:12px;border:2px solid var(--border);margin-bottom:10px;cursor:pointer;overflow:hidden}
.wkcard.sel{border-color:var(--pine)}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk.on{background:var(--pine);border-color:var(--pine)}
.invbadge{background:var(--greenlt);color:var(--green);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
.stickybot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px;background:var(--paper);border-top:1px solid var(--border);box-sizing:border-box;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.imodal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.imodal img{max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain}
.imodalx{position:absolute;top:20px;right:20px;color:white;font-size:30px;cursor:pointer;line-height:1}
.empty{text-align:center;padding:60px 20px;color:var(--slate)}
.sep{height:1px;background:var(--border);margin:14px 0}
.notes-area{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:14px;color:var(--ink);outline:none;font-family:inherit;resize:vertical;min-height:80px;line-height:1.5}
.notes-area:focus{border-color:var(--pine)}
.proj-row{display:flex;align-items:center;padding:10px 16px;border-top:1px solid var(--border);cursor:pointer;gap:10px}
.proj-row:active{background:#f0ece4}
.dash-stat{background:var(--paper);border-radius:14px;border:1px solid var(--border);padding:16px;margin-bottom:12px}
.dash-num{font-size:28px;font-weight:800;color:var(--pine);font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
.dash-sub{font-size:13px;color:var(--slate);margin-top:6px}
.shortcut{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.shortcut:active{background:#f0ece4}
.ytd-toggle{background:none;border:none;width:100%;text-align:left;padding:12px 16px;font-size:13px;font-weight:700;color:var(--pine);cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center}
.gear-btn{background:none;border:none;cursor:pointer;padding:4px;color:var(--cream);display:flex;align-items:center}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const ME={name:"Dennis Winders",line1:"12 Rogers St, Plymouth NH 03264",phone:"(603) 726-6300",venmo:"@Dennis-Winders",zelle:"denniswinders@gmail.com"};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DEFAULT_SYNC_URL="https://script.google.com/macros/s/AKfycbzcdj0ytpXspwHteqU2-o285rqEgjXlsbwSmHoskurNFPEwYaIKCDKNim38hb_FkAA/exec";

// ── utils ──────────────────────────────────────────────────────────────────
const uid=()=>Math.random().toString(36).slice(2,9);
const tod=()=>new Date().toISOString().slice(0,10);
const f$=(n)=>"$"+Number(n||0).toFixed(2);
const esc=(s)=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function wkStart(d){const dt=new Date(d+"T12:00:00"),dy=dt.getDay();return new Date(new Date(d+"T12:00:00").setDate(dt.getDate()-dy+(dy===0?-6:1))).toISOString().slice(0,10);}
function shiftWk(ws,n){const dt=new Date(ws+"T12:00:00");dt.setDate(dt.getDate()+n*7);return dt.toISOString().slice(0,10);}
function wkDays(ws){return Array.from({length:7},(_,i)=>{const dt=new Date(ws+"T12:00:00");dt.setDate(dt.getDate()+i);return dt.toISOString().slice(0,10);});}
function wkLabel(ws){const d=wkDays(ws);return fd(d[0])+" \u2013 "+fd(d[6]);}
const fd=(d)=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fdl=(d)=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
function hrs(i,o){if(!i||!o)return 0;const[h1,m1]=i.split(":").map(Number),[h2,m2]=o.split(":").map(Number),m=(h2*60+m2)-(h1*60+m1);return m>0?+(m/60).toFixed(2):0;}

// ── local storage primitives ───────────────────────────────────────────────
const sg=(k,fb=null)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};
const sgr=(k)=>{try{return localStorage.getItem(k);}catch{return null;}};
const ssr=(k,v)=>{try{localStorage.setItem(k,v);}catch{}};
const sl=(p)=>{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p))ks.push(k);}return ks;};

// ── sync layer ─────────────────────────────────────────────────────────────
// Keys that stay local-only and never sync to Sheets
const LOCAL_ONLY=new Set(["carp-sync-url","carp-last","carp-ytd-open"]);

let syncUrl=localStorage.getItem("carp-sync-url")||DEFAULT_SYNC_URL;
if(!localStorage.getItem("carp-sync-url"))localStorage.setItem("carp-sync-url",DEFAULT_SYNC_URL);

async function bgSync(action,key,value){
  if(!syncUrl)return;
  if(key.startsWith("carp-img-")||LOCAL_ONLY.has(key))return;
  try{
    await fetch(syncUrl,{method:"POST",redirect:"follow",body:JSON.stringify({action,key,value})});
  }catch{}
}

async function pullFromSheets(){
  if(!syncUrl)return false;
  try{
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch(syncUrl+"?action=getAll",{redirect:"follow",signal:ctrl.signal});
    clearTimeout(t);
    const d=await r.json();
    if(d.ok&&d.data){
      Object.entries(d.data).forEach(([k,v])=>{
        if(!k.startsWith("carp-img-")&&!LOCAL_ONLY.has(k)){
          try{localStorage.setItem(k,v);}catch{}
        }
      });
      return true;
    }
  }catch(e){
    if(e.name==="AbortError")console.log("Sync timed out");
    else console.error("Pull error:",e);
  }
  return false;
}

async function pushToSheets(){
  if(!syncUrl)return false;
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&!k.startsWith("carp-img-")&&!LOCAL_ONLY.has(k)){
      data[k]=localStorage.getItem(k);
    }
  }
  try{
    const r=await fetch(syncUrl,{method:"POST",redirect:"follow",body:JSON.stringify({action:"setMany",data})});
    const d=await r.json();
    return d.ok;
  }catch{return false;}
}

// ── storage (synced) ───────────────────────────────────────────────────────
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{} bgSync("set",k,JSON.stringify(v));}
function sd(k){try{localStorage.removeItem(k);}catch{} bgSync("delete",k,null);}

// ── storage keys ───────────────────────────────────────────────────────────
const K={cl:"carp-cl",proj:"carp-proj",wk:(p,w)=>"carp-w-"+p+"__"+w,img:(i)=>"carp-img-"+i,invd:(p)=>"carp-invd-"+p,last:"carp-last",ytd:"carp-ytd-open"};

// ── invoiced ───────────────────────────────────────────────────────────────
const getInvd=(pid)=>sg(K.invd(pid),[])||[];
const isInvd=(pid,ws)=>getInvd(pid).includes(ws);
function markInvd(pid,wsArr){ss(K.invd(pid),[...new Set([...getInvd(pid),...wsArr])]);}
function toggleInvd(pid,ws){const c=getInvd(pid);ss(K.invd(pid),c.includes(ws)?c.filter(x=>x!==ws):[...c,ws]);}

// ── image compression ──────────────────────────────────────────────────────
function compressImg(file){return new Promise(res=>{
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{
    const M=1200;let w=img.width,h=img.height;
    if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",.72));
  };img.src=e.target.result;};r.readAsDataURL(file);
});}

// ── state ──────────────────────────────────────────────────────────────────
let clients=[];
let projects=[];
let nav={screen:"clients"};
let wd={days:{},notes:""};
let saveT=null;
let selWks=new Set();

const getCl=(cid)=>clients.find(c=>c.id===cid)||{};
const getProj=(pid)=>projects.find(p=>p.id===pid)||{};

// ── migration ──────────────────────────────────────────────────────────────
function migrate(){
  const existingProjs=sg(K.proj,[]);
  const cls=sg(K.cl,[]);
  if(existingProjs.length>0||cls.length===0)return;
  const hasProjField=cls.some(c=>c.project);
  if(!hasProjField)return;
  const newProjs=[];
  cls.forEach(c=>{
    if(c.project){
      const pid=uid();
      newProjs.push({id:pid,clientId:c.id,name:c.project,rate:c.rate,archived:false,createdAt:tod(),lastOpened:null});
      sl("carp-w-"+c.id+"__").forEach(oldKey=>{
        const ws=oldKey.split("__")[1];
        ss(K.wk(pid,ws),sg(oldKey,{days:{},notes:""}));
      });
      const oldInvd=sg(K.invd(c.id),[]);
      if(oldInvd.length>0)ss(K.invd(pid),oldInvd);
    }
  });
  ss(K.proj,newProjs);
  ss(K.cl,cls.map(c=>({id:c.id,name:c.name,address:c.address,rate:c.rate})));
}

// ── toast ──────────────────────────────────────────────────────────────────
let toastT;
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2400);}

// ── nav ────────────────────────────────────────────────────────────────────
function go(screen,p={}){nav={screen,...p};render();}
function render(){
  const a=document.getElementById("app");
  switch(nav.screen){
    case"clients":rClients(a);break;
    case"add-cl":rAddCl(a);break;
    case"add-proj":rAddProj(a);break;
    case"week":rWeek(a);break;
    case"list":rList(a);break;
    case"invoice":rInvoice(a);break;
    case"dash":rDash(a);break;
    case"settings":rSettings(a);break;
  }
}

// ── shared icon buttons ────────────────────────────────────────────────────
const dashBtn=()=>'<button onclick="go(\'dash\')" style="background:none;border:none;cursor:pointer;padding:4px;display:flex;color:var(--cream)">'
  +'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>';

const gearBtn=()=>'<button onclick="go(\'settings\')" class="gear-btn">'
  +'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>';

// ── CLIENT LIST ────────────────────────────────────────────────────────────
function rClients(a){
  const recentPids=new Set([...projects].sort((a,b)=>(b.lastOpened||"").localeCompare(a.lastOpened||"")).slice(0,3).map(p=>p.id));
  const activeClients=clients.filter(c=>!c.archived);
  const archivedClients=clients.filter(c=>c.archived);

  const clientCard=(c)=>{
    const cProjs=projects.filter(p=>p.clientId===c.id&&!p.archived);
    const arcProjs=projects.filter(p=>p.clientId===c.id&&p.archived);
    return '<div class="card">'
      +'<div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center">'
      +'<div><div style="font-size:15px;font-weight:800;color:var(--ink)">'+esc(c.name)+'</div>'
      +(c.address?'<div style="font-size:11px;color:var(--slate);margin-top:1px">'+esc(c.address)+'</div>':"")
      +'<div style="font-size:11px;color:var(--amber);margin-top:1px;font-weight:600">'+f$(c.rate)+'/hr base rate</div></div>'
      +'<button class="bsm" style="background:var(--paper);color:var(--slate);border:1px solid var(--border);font-size:11px" onclick="go(\'add-cl\',{ex:\''+c.id+'\'})">Edit</button></div>'
      +(cProjs.length>0
        ?cProjs.map(p=>'<div class="proj-row" onclick="openProj(\''+p.id+'\')">'
          +'<div style="width:7px;height:7px;border-radius:50%;background:'+(recentPids.has(p.id)?'var(--green)':'var(--border)')+';flex-shrink:0"></div>'
          +'<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;color:var(--ink)">'+esc(p.name)+'</div>'
          +(p.rate!==c.rate?'<div style="font-size:11px;color:var(--amber)">'+f$(p.rate)+'/hr</div>':"")+'</div>'
          +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>'
          +'<button onclick="event.stopPropagation();go(\'add-proj\',{ex:\''+p.id+'\',cid:\''+c.id+'\'})" style="background:none;border:none;color:var(--slate);cursor:pointer;padding:2px 6px;font-size:12px">&#x22EE;</button>'
          +'</div>').join("")
        :'<div style="padding:10px 16px;font-size:13px;color:var(--slate);border-top:1px solid var(--border)">No active projects</div>')
      +(arcProjs.length>0?'<div style="padding:6px 16px;font-size:11px;color:var(--slate);border-top:1px solid var(--border)">'
        +arcProjs.map(p=>'<span onclick="go(\'add-proj\',{ex:\''+p.id+'\',cid:\''+c.id+'\'})" style="color:var(--slate);text-decoration:underline;cursor:pointer;margin-right:10px">&#x1F4E6; '+esc(p.name)+'</span>').join("")+'</div>':"")
      +'<div style="padding:8px 16px;border-top:1px solid var(--border)">'
      +'<button class="bsm" style="background:var(--amberlt);color:var(--amber);font-size:12px;padding:6px 12px" onclick="go(\'add-proj\',{ex:null,cid:\''+c.id+'\'})">+ Add Project</button>'
      +'</div></div>';
  };

  a.innerHTML='<div class="topbar">'+dashBtn()
    +'<div style="flex:1"><div style="font-size:19px;font-weight:800">&#x1F528; Carpentry</div>'
    +'<div style="font-size:11px;color:#9BBFA9;text-transform:uppercase;letter-spacing:.4px;margin-top:1px">Dennis Winders</div></div>'
    +'<button class="bsm" style="background:var(--amber);color:white;font-size:22px;padding:3px 11px;font-weight:300" onclick="go(\'add-cl\',{ex:null})">+</button></div>'
    +'<div class="bp">'
    +(activeClients.length===0&&archivedClients.length===0
      ?'<div class="empty"><div style="font-size:40px;margin-bottom:12px">&#x1F4C1;</div><div style="font-weight:700;margin-bottom:6px">No clients yet</div><div style="font-size:13px">Tap + to create your first client</div></div>'
      :activeClients.map(clientCard).join("")
    )
    +(archivedClients.length>0
      ?'<div style="font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.7px;margin:16px 0 8px">&#x1F4E6; Archived ('+archivedClients.length+')</div>'
        +archivedClients.map(c=>'<div style="opacity:0.6">'+clientCard(c)+'</div>').join("")
      :"")
    +'</div>';
}

function openProj(pid){
  const p=getProj(pid);if(!p.id)return;
  projects=projects.map(x=>x.id===pid?{...x,lastOpened:new Date().toISOString()}:x);
  ss(K.proj,projects);
  localStorage.setItem(K.last,JSON.stringify({projectId:pid,ts:new Date().toISOString()}));
  wd=sg(K.wk(pid,wkStart(tod())),{days:{},notes:""});
  go("week",{proj:{...p,lastOpened:new Date().toISOString()},ws:wkStart(tod())});
}

// ── ADD / EDIT CLIENT ──────────────────────────────────────────────────────
function rAddCl(a){
  const c=nav.ex?getCl(nav.ex):{};
  window._carc=c.archived||false;

function gday(d){if(!wd.days[d])wd.days[d]={timeIn:"",timeOut:"",receipts:[]};return wd.days[d];}
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>ss(K.wk(nav.proj.id,nav.ws),wd),600);}
function utIn(d,v){gday(d).timeIn=v;persist();rHrs(d);rSum();}
function utOut(d,v){gday(d).timeOut=v;persist();rHrs(d);rSum();}
function rHrs(d){const el=document.getElementById("h-"+d);if(el){const x=wd.days[d]||{};const h=hrs(x.timeIn,x.timeOut);el.textContent=h>0?h+"h":"";}}
function uVend(d,i,v){const day=gday(d);if(day.receipts[i])day.receipts[i].vendor=v;persist();}
function uAmt(d,i,v){const day=gday(d);if(day.receipts[i])day.receipts[i].amount=v;persist();rSum();}
function uNotes(v){wd.notes=v;persist();}
function clearDay(date){

  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";

// ── BUILD INVOICE DATA ─────────────────────────────────────────────────────
function buildInvData(){
  const sws=[...nav.wks].sort();
  const cl=getCl(nav.proj.clientId);
  const rate=nav.proj.rate||65;
  const wdata=sws.map(ws=>({ws,data:sg(K.wk(nav.proj.id,ws),{days:{},notes:""})}));
  const allDays=[],lumpWks=[],notesArr=[];
  wdata.forEach(({ws,data})=>{
    if(data.notes)notesArr.push(data.notes);
    if(data.lumpSum&&(data.lumpSum.hours>0||data.lumpSum.materials>0)){lumpWks.push({ws,...data.lumpSum});}
    else{Object.entries(data.days||{}).forEach(([date,day])=>{
      const h=hrs(day.timeIn,day.timeOut),recs=(day.receipts||[]).filter(r=>r.vendor||r.amount||r.imgKey);
      if(h>0||recs.length>0)allDays.push({date,timeIn:day.timeIn,timeOut:day.timeOut,h,recs});
    });}
  });
  allDays.sort((a,b)=>a.date.localeCompare(b.date));
  const labDays=allDays.filter(d=>d.h>0);
  const th=+labDays.reduce((s,d)=>s+d.h,0).toFixed(2);
  const lab=+(th*rate).toFixed(2);
  const lumpHrs=+lumpWks.reduce((s,w)=>s+(w.hours||0),0).toFixed(2);
  const lumpLab=+(lumpHrs*rate).toFixed(2);
  const lumpMat=+lumpWks.reduce((s,w)=>s+(w.materials||0),0).toFixed(2);
  const allR=allDays.flatMap(d=>d.recs.map(r=>({...r,date:d.date})));
  const dayMat=+allR.reduce((s,r)=>s+parseFloat(r.amount||0),0).toFixed(2);
  const mat=+(dayMat+lumpMat).toFixed(2);
  const laborTotal=+(lab+lumpLab).toFixed(2);
  const tot=+(laborTotal+mat).toFixed(2);
  const allDates=[...allDays.map(d=>d.date),...lumpWks.map(w=>w.ws)].sort();
  const dr=allDates.length===0?"":allDates.length===1?fd(allDates[0]):fd(allDates[0])+" \u2013 "+fd(allDates[allDates.length-1]);
  const invn="INV-"+new Date().toISOString().slice(0,10).replace(/-/g,"");
  return{allDays,labDays,th,lab,lumpWks,lumpHrs,lumpLab,lumpMat,allR,dayMat,mat,laborTotal,tot,dr,invn,notesStr:notesArr.filter(Boolean).join("\n\n"),rate,cl};
}

// ── PDF ────────────────────────────────────────────────────────────────────
async function doPDF(){
  if(!window.jspdf){toast("PDF library not loaded");return;}
  toast("Building PDF...");
  const{allDays,labDays,th,lab,lumpWks,lumpHrs,lumpLab,lumpMat,allR,mat,laborTotal,tot,dr,invn,notesStr,rate,cl}=buildInvData();
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF('p','mm','letter');
  const pw=215.9,ml=20,mr=20,cw=pw-ml-mr;let y=0;
  const chkPg=(need=10)=>{if(y+need>262){doc.addPage();y=20;}};
  doc.setFillColor(30,59,42);doc.rect(0,0,pw,54,'F');
  doc.setTextColor(243,237,226);doc.setFontSize(17);doc.setFont('helvetica','bold');doc.text(ME.name,ml,18);
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(155,191,169);
  doc.text(ME.line1,ml,27);doc.text(ME.phone,ml,34);doc.text('Venmo: '+ME.venmo+'   Zelle: '+ME.zelle,ml,41);
  y=64;
  doc.setTextColor(90,100,114);doc.setFontSize(8);doc.setFont('helvetica','bold');
  doc.text('BILLED TO',ml,y);doc.text(invn,pw-mr,y,{align:'right'});y+=6;
  doc.setTextColor(26,26,26);doc.setFontSize(13);doc.setFont('helvetica','bold');
  doc.text(cl.name||nav.proj.name,ml,y);
  doc.setTextColor(90,100,114);doc.setFontSize(9);doc.text(dr,pw-mr,y,{align:'right'});
  if(cl.address){y+=5;doc.setFont('helvetica','normal');doc.text(cl.address,ml,y);}
  if(nav.proj.name){y+=5;doc.setFont('helvetica','italic');doc.text(nav.proj.name,ml,y);}
  y+=8;doc.setFont('helvetica','normal');
  doc.setDrawColor(216,208,196);doc.line(ml,y,pw-mr,y);y+=8;
  if(labDays.length>0||lumpWks.length>0){
    doc.setTextColor(90,100,114);doc.setFontSize(8);doc.setFont('helvetica','bold');doc.text('LABOR',ml,y);y+=7;
    [...labDays.map(d=>({label:fdl(d.date),sub:(d.timeIn||'')+'\u2013'+(d.timeOut||'')+' \u00b7 '+d.h+'h',val:d.h*rate})),
     ...lumpWks.map(w=>({label:wkLabel(w.ws)+' (summary)',sub:(w.hours||0)+'h'+(w.note?' \u00b7 '+w.note:''),val:(w.hours||0)*rate}))
    ].forEach(row=>{
      chkPg(7);
      doc.setTextColor(26,26,26);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text(row.label,ml,y);
      doc.setFont('helvetica','normal');doc.setTextColor(90,100,114);doc.setFontSize(9);doc.text(row.sub,ml+55,y);
      doc.setTextColor(30,59,42);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text(f$(row.val),pw-mr,y,{align:'right'});y+=6;
    });
    chkPg(8);y+=2;doc.setDrawColor(216,208,196);doc.line(ml,y,pw-mr,y);y+=5;
    doc.setTextColor(90,100,114);doc.setFontSize(9);doc.setFont('helvetica','normal');
    doc.text('Labor Subtotal ('+(+(th+lumpHrs).toFixed(2))+'h @ '+f$(rate)+'/hr)',ml,y);
    doc.setTextColor(30,59,42);doc.setFont('helvetica','bold');doc.text(f$(laborTotal),pw-mr,y,{align:'right'});y+=10;
  }
  if(allR.length>0){
    chkPg(15);doc.setDrawColor(216,208,196);doc.line(ml,y,pw-mr,y);y+=8;
    doc.setTextColor(90,100,114);doc.setFontSize(8);doc.setFont('helvetica','bold');doc.text('MATERIALS',ml,y);y+=7;
    allR.forEach(r=>{
      chkPg(7);
      doc.setTextColor(26,26,26);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text(r.vendor||'Receipt',ml,y);
      doc.setFont('helvetica','normal');doc.setTextColor(90,100,114);doc.setFontSize(9);doc.text(fd(r.date),ml+55,y);
      doc.setTextColor(184,122,26);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text(f$(parseFloat(r.amount||0)),pw-mr,y,{align:'right'});y+=6;
    });
    if(lumpMat>0){chkPg(7);doc.setTextColor(26,26,26);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text('Backdated materials',ml,y);doc.setTextColor(184,122,26);doc.text(f$(lumpMat),pw-mr,y,{align:'right'});y+=6;}
    chkPg(8);y+=2;doc.setDrawColor(216,208,196);doc.line(ml,y,pw-mr,y);y+=5;
    doc.setTextColor(90,100,114);doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text('Materials Subtotal',ml,y);
    doc.setTextColor(184,122,26);doc.setFont('helvetica','bold');doc.text(f$(mat),pw-mr,y,{align:'right'});y+=10;
  }
  if(notesStr){
    chkPg(20);doc.setDrawColor(216,208,196);doc.line(ml,y,pw-mr,y);y+=8;
    doc.setTextColor(90,100,114);doc.setFontSize(8);doc.setFont('helvetica','bold');doc.text('NOTES',ml,y);y+=7;
    doc.setTextColor(26,26,26);doc.setFontSize(10);doc.setFont('helvetica','normal');
    doc.splitTextToSize(notesStr,cw).forEach(line=>{chkPg(6);doc.text(line,ml,y);y+=5;});y+=4;
  }
  chkPg(20);doc.setFillColor(30,59,42);doc.rect(0,y,pw,20,'F');
  doc.setTextColor(243,237,226);doc.setFontSize(14);doc.setFont('helvetica','bold');
  doc.text('Invoice Total',ml,y+13);doc.setFontSize(18);doc.text(f$(tot),pw-mr,y+13,{align:'right'});y+=30;
  const imgRecs=allR.filter(r=>r.imgKey&&sgr(r.imgKey));
  if(imgRecs.length>0){
    const imgData=await Promise.all(imgRecs.map(r=>new Promise(res=>{
      const img=new Image();const src=sgr(r.imgKey);
      img.onload=()=>res({src,nw:img.naturalWidth,nh:img.naturalHeight,r});
      img.onerror=()=>res(null);img.src=src;
    })));
    imgData.filter(Boolean).forEach(({src,nw,nh,r})=>{
      doc.addPage();let py=20;
      doc.setTextColor(90,100,114);doc.setFontSize(8);doc.setFont('helvetica','bold');doc.text('RECEIPT',ml,py);py+=6;
      doc.setTextColor(26,26,26);doc.setFontSize(11);doc.setFont('helvetica','bold');
      doc.text((r.vendor||'Receipt')+' \u00b7 '+fd(r.date)+' \u00b7 '+f$(parseFloat(r.amount||0)),ml,py);py+=8;
      const maxW=cw,maxH=220;let iw=maxW,ih=maxW*(nh/nw);
      if(ih>maxH){ih=maxH;iw=maxH*(nw/nh);}
      doc.addImage(src,'JPEG',ml+(cw-iw)/2,py,iw,ih);
    });
  }
  doc.save(invn+'.pdf');toast('PDF downloaded');
}

// ── DASHBOARD ──────────────────────────────────────────────────────────────
function calcDash(){
  const now=new Date();
  const ago30=new Date(now-30*864e5).toISOString().slice(0,10);
  const ytdStart=now.getFullYear()+'-01-01';
  let h30=0,lab30=0,mat30=0,uninv=0,uninvProjs=new Set(),ytdLab=0,ytdMat=0;
  projects.forEach(p=>{
    const keys=sl("carp-w-"+p.id+"__");
    const invdSet=new Set(getInvd(p.id));
    const rate=p.rate||65;
    keys.forEach(k=>{
      const ws=k.split("__")[1];
      const data=sg(k,{days:{},notes:""});
      let wh=0,wm=0;
      if(data.lumpSum){wh=+(data.lumpSum.hours||0);wm=+(data.lumpSum.materials||0);}
      else{Object.values(data.days||{}).forEach(d=>{wh+=hrs(d.timeIn,d.timeOut);(d.receipts||[]).forEach(r=>wm+=parseFloat(r.amount||0));});}
      wh=+wh.toFixed(2);wm=+wm.toFixed(2);
      const wLab=+(wh*rate).toFixed(2);
      if(ws>=ago30){h30+=wh;lab30+=wLab;mat30+=wm;}
      if(ws>=ytdStart){ytdLab+=wLab;ytdMat+=wm;}
      if(!p.archived&&!getCl(p.clientId).archived&&!invdSet.has(ws)&&(wh>0||wm>0)){uninv+=wLab+wm;uninvProjs.add(p.id);}
    });
  });
  return{h30:+h30.toFixed(2),lab30:+lab30.toFixed(2),mat30:+mat30.toFixed(2),tot30:+(lab30+mat30).toFixed(2),
    uninv:+uninv.toFixed(2),uninvProjCount:uninvProjs.size,
    ytdLab:+ytdLab.toFixed(2),ytdMat:+ytdMat.toFixed(2),ytdTot:+(ytdLab+ytdMat).toFixed(2)};
}

  let html='<div class="topbar"><button class="back" onclick="go(\'clients\')">&#8249;</button>'

    +gearBtn()+'</div>'
    +'<div class="bp">'
    +'<div class="dash-stat"><div style="font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">Last 30 Days</div>'
    +'<div class="dash-num">'+f$(d.tot30)+'</div>'
    +'<div class="dash-sub">'+f$(d.lab30)+' labor &middot; '+f$(d.mat30)+' materials &middot; '+d.h30+'h</div></div>'
    +'<div class="dash-stat" style="border-color:'+(d.uninv>0?'var(--amber)':'var(--border)')+'">'
    +'<div style="font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">Uninvoiced</div>'
    +'<div class="dash-num" style="color:'+(d.uninv>0?'var(--amber)':'var(--pine)')+'">'+f$(d.uninv)+'</div>'
    +'<div class="dash-sub">across '+d.uninvProjCount+' project'+(d.uninvProjCount!==1?'s':'')+'</div></div>'
    +(recent.length>0
      ?'<div style="font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">Jump Back In</div>'
        +recent.map(p=>{const cl=getCl(p.clientId);return'<div class="shortcut" onclick="openProj(\''+p.id+'\')">'
          +'<div><div style="font-size:14px;font-weight:700;color:var(--ink)">'+esc(p.name)+'</div>'
          +'<div style="font-size:12px;color:var(--slate);margin-top:1px">'+esc(cl.name||"")+'</div></div>'
          +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></div>';}).join("")
      :"")
    +'<div class="card" style="margin-top:4px">'
    +'<button class="ytd-toggle" onclick="ss(K.ytd,!sg(K.ytd,false));rDash(document.getElementById(\'app\'))">'
    +'<span>Year to Date</span><span style="font-size:18px;color:var(--slate)">'+(ytdOpen?'&#x25BE;':'&#x25B8;')+'</span></button>'
    +(ytdOpen?'<div style="padding:0 16px 14px;border-top:1px solid var(--border)">'
      +'<div style="display:flex;justify-content:space-between;margin-top:10px"><span style="font-size:13px;color:var(--slate)">Labor</span><span style="font-size:14px;font-weight:700;color:var(--pine);font-variant-numeric:tabular-nums">'+f$(d.ytdLab)+'</span></div>'
      +'<div style="display:flex;justify-content:space-between;margin-top:6px"><span style="font-size:13px;color:var(--slate)">Materials</span><span style="font-size:14px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums">'+f$(d.ytdMat)+'</span></div>'
      +'<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-size:14px;font-weight:700;color:var(--ink)">Total</span><span style="font-size:16px;font-weight:800;color:var(--pine);font-variant-numeric:tabular-nums">'+f$(d.ytdTot)+'</span></div>'
      +'</div>':"")
    +'</div>'
    +'<div style="font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.7px;margin:16px 0 8px">Add Backdated Week</div>'
    +'<div class="card"><div class="cbody" style="display:flex;flex-direction:column;gap:12px">'
    +'<div><label class="lbl">Project</label>'
    +'<select class="inp" id="bd-proj" style="-webkit-appearance:none;appearance:none">'
    +'<option value="">Select project...</option>'
    +activeProjs.map(p=>{const cl=getCl(p.clientId);return'<option value="'+p.id+'">'+esc(cl.name||"")+' \u2014 '+esc(p.name)+'</option>';}).join("")
    +'</select></div>'
    +'<div><label class="lbl">Week Starting</label><input class="inp" id="bd-wk" type="date" value="'+wkStart(tod())+'"></div>'
    +'<div style="display:flex;gap:10px">'
    +'<div style="flex:1"><label class="lbl">Hours</label><input class="inp" id="bd-hrs" type="number" inputmode="decimal" placeholder="0" min="0"></div>'
    +'<div style="flex:1"><label class="lbl">Materials ($)</label><input class="inp" id="bd-mat" type="number" inputmode="decimal" placeholder="0.00" min="0"></div>'
    +'</div>'
    +'<div><label class="lbl">Note (optional)</label><input class="inp" id="bd-note" type="text" placeholder="e.g. Framing rough-in week"></div>'
    +'<button class="btnp" onclick="saveLump()">Save Backdated Entry</button>'
    +'</div></div></div>';
  a.innerHTML=html;
}

function saveLump(){
  const pid=document.getElementById("bd-proj").value;
  const rawWk=document.getElementById("bd-wk").value;
  const hVal=parseFloat(document.getElementById("bd-hrs").value)||0;
  const mVal=parseFloat(document.getElementById("bd-mat").value)||0;
  const note=document.getElementById("bd-note").value.trim();
  if(!pid){toast("Select a project");return;}
  if(!rawWk){toast("Select a week");return;}
  if(hVal===0&&mVal===0){toast("Enter hours or materials");return;}
  const ws=wkStart(rawWk);
  const existing=sg(K.wk(pid,ws),{days:{},notes:""});
  ss(K.wk(pid,ws),{...existing,lumpSum:{hours:hVal,materials:mVal,note}});
  toast("Entry saved for "+wkLabel(ws));
  document.getElementById("bd-hrs").value="";
  document.getElementById("bd-mat").value="";
  document.getElementById("bd-note").value="";
}

// ── SETTINGS ───────────────────────────────────────────────────────────────
function rSettings(a){
  a.innerHTML='<div class="topbar"><button class="back" onclick="go(\'dash\')">&#8249;</button>'
    +'<div style="flex:1;font-size:16px;font-weight:700">Sync Settings</div></div>'
    +'<div class="bp">'
    +'<div class="card"><div class="cbody" style="display:flex;flex-direction:column;gap:14px">'
    +'<div><label class="lbl">Google Apps Script URL</label>'
    +'<input class="inp" id="surl" type="url" value="'+esc(syncUrl)+'" placeholder="https://script.google.com/macros/s/...">'
    +'<div style="font-size:12px;color:var(--slate);margin-top:6px;line-height:1.5">Connects the app to your Google Sheet. The same URL works on all your devices.</div></div>'
    +'<button class="btnp" onclick="saveSyncUrl()">Save &amp; Test Connection</button>'
    +'</div></div>'
    +'<div style="font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.7px;margin:16px 0 8px">One-Time Data Push</div>'
    +'<div class="card"><div class="cbody" style="display:flex;flex-direction:column;gap:10px">'
    +'<div style="font-size:13px;color:var(--slate);line-height:1.5">If you have data on this device not yet in Sheets, push it up now. Do this once from each device you\'ve used before setting up sync.</div>'
    +'<button class="btnp" style="background:var(--amber)" onclick="pushAll()">Push This Device\'s Data to Sheets</button>'
    +'</div></div>'
    +'</div>';
}

async function saveSyncUrl(){
  const url=document.getElementById("surl").value.trim();
  syncUrl=url;
  localStorage.setItem("carp-sync-url",url);
  toast("Testing connection...");
  try{
    const r=await fetch(url+"?action=getAll",{redirect:"follow"});
    const d=await r.json();
    toast(d.ok?"Connected \u2713":"Error in response — check script");
  }catch{toast("Connection failed \u2014 check URL");}
}

async function pushAll(){
  toast("Pushing to Sheets...");
  const ok=await pushToSheets();
  toast(ok?"All data pushed \u2713":"Push failed \u2014 check URL");
}

// ── BOOT ───────────────────────────────────────────────────────────────────
async function boot(){
  migrate();
  if(syncUrl){
    if(navigator.onLine){
      document.getElementById("app").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:14px;color:var(--slate);background:var(--cream)">'
        +'<div style="font-size:40px">&#x1F528;</div>'
        +'<div style="font-size:14px;font-weight:600;color:var(--pine)">Syncing...</div></div>';
      await pullFromSheets();
    }else{
      toast("Offline \u2014 using local data");
    }
  }
  clients=sg(K.cl,[])||[];
  projects=sg(K.proj,[])||[];
  const last=sg(K.last,null);
  if(last){
    const sevenAgo=new Date(Date.now()-7*864e5).toISOString();
    const p=projects.find(x=>x.id===last.projectId&&!x.archived);
    if(p&&last.ts&&last.ts>sevenAgo){
      wd=sg(K.wk(p.id,wkStart(tod())),{days:{},notes:""});
      go("week",{proj:p,ws:wkStart(tod())});
      return;
    }
  }
  go("clients");
}

// Re-sync automatically when coming back online
window.addEventListener("online",async()=>{
  toast("Back online \u2014 syncing...");
  await pushToSheets();
  await pullFromSheets();
  toast("Synced \u2713");
});

// Register service worker for offline support
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/Carpentry/sw.js").catch(e=>console.log("SW:",e));
}

boot();
</script>
</body>
</html>
